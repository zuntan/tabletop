<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%">
  <title>Temporary area</title>
  <desc>Only the tray frame stretches. The English sign retains its size; the center is transparent.</desc>
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="16" y="28" style="width:calc(100% - 32px);height:calc(100% - 44px)" rx="10" stroke="#8da4b3" stroke-width="3"/>
    <svg x="20" y="100%" style="width:calc(100% - 40px)" height="1" overflow="visible">
      <line x1="0" y1="-28" x2="100%" y2="-28" stroke="#c0cdd5" stroke-width="2"/>
    </svg>
    <svg x="0" y="100%" width="1" height="1" overflow="visible">
      <path d="M20 -28L16 -16" stroke="#a5b7c2" stroke-width="2"/>
    </svg>
    <svg x="100%" y="100%" width="1" height="1" overflow="visible">
      <path d="M-20 -28L-16 -16" stroke="#a5b7c2" stroke-width="2"/>
    </svg>
  </g>
  <svg x="50%" y="28" width="1" height="1" overflow="visible">
    <g transform="translate(-100,-23)" stroke-linejoin="round">
      <rect width="200" height="46" rx="7" fill="#e5edf1" stroke="#849eaf" stroke-width="2.5"/>
      <text x="100" y="33" text-anchor="middle" font-family="sans-serif" font-weight="700" font-size="24" fill="#4e697b">TEMP AREA</text>
    </g>
  </svg>
</svg>
